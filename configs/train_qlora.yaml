model_name_or_path: Qwen/Qwen2.5-3B-Instruct
output_dir: outputs/checkpoints/qwen2_5_railway_qlora
train_file: data/instructions/train.jsonl
eval_file: data/instructions/valid.jsonl

max_seq_length: 2048
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 0.0002
num_train_epochs: 3
warmup_ratio: 0.03
logging_steps: 10
save_steps: 200
eval_steps: 200
save_total_limit: 3

load_in_4bit: true
bnb_4bit_quant_type: nf4
bnb_4bit_compute_dtype: bfloat16
bnb_4bit_use_double_quant: true

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

gradient_checkpointing: true
optim: paged_adamw_8bit
bf16: true
fp16: false
