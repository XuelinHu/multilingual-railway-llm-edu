paths:
  train_sft: data/sft/train.jsonl
  dev_sft: data/sft/dev.jsonl
  training_output_dir: experiments/lora/runs/qwen2_5_7b_lora

model:
  name_or_path: Qwen/Qwen2.5-7B-Instruct
  trust_remote_code: false
  torch_dtype: bfloat16
  use_flash_attention_2: false

quantization:
  enabled: true
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  enabled: true
  r: 16
  alpha: 32
  dropout: 0.05
  bias: none
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  max_seq_length: 1024
  num_train_epochs: 2
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  logging_steps: 10
  eval_steps: 50
  save_steps: 50
  save_total_limit: 2
  lr_scheduler_type: cosine
  gradient_checkpointing: true
  seed: 42

