processed_chunks: data/processed/chunks.jsonl
glossary_file: data/processed/terms.jsonl
index_dir: data/rag/faiss_index

embedding_model: BAAI/bge-m3
device: cuda
batch_size: 16
normalize_embeddings: true

retrieval:
  top_k: 5
  max_context_chars: 3500
  min_score: 0.1

generation:
  model_name_or_path: outputs/checkpoints/qwen2_5_railway_qlora
  fallback_model_name_or_path: Qwen/Qwen2.5-3B-Instruct
  max_new_tokens: 768
  temperature: 0.2
  top_p: 0.9
